
name: Build Nomelia APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: ./gradlew :komelia-app:androidApp:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nomelia-Release-APK
          path: komelia-app/androidApp/build/outputs/apk/release/*.apk
